<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Celda de clasificación documental</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(820px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="dark"><main class="iso-page"><style>.iso{--cl-glow:#ffe2a0;--cl-glow-k:.5;--cl-glow-line:#fff3d1}
.iso[data-theme="light"]{--cl-glow:#f2b33d;--cl-glow-k:.24;--cl-glow-line:#c77d0a}
.cl-stage{position:relative;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.cl-stage[data-dragging]{cursor:grabbing}
.cl-stage:focus{outline:none}
.cl-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.cl-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.cl-svg{overflow:hidden}
.cl-item{transition:opacity .45s var(--anatomy-ease)}
.cl-svg[data-focus] .cl-item{opacity:.14}
.cl-svg[data-focus="cinta"] .cl-item[data-group="cinta"],
.cl-svg[data-focus="escaner"] .cl-item[data-group="escaner"],
.cl-svg[data-focus="brazo"] .cl-item[data-group="brazo"],
.cl-svg[data-focus="bandejas"] .cl-item[data-group="bandejas"],
.cl-svg[data-focus="control"] .cl-item[data-group="control"]{opacity:1}
.cl-svg[data-wire] .iso-fill,.cl-svg[data-wire] .iso-shade,.cl-svg[data-wire] .iso-top,.cl-svg[data-wire] .cl-window{fill:none!important;stroke:none!important}
.cl-svg[data-wire] .iso-halo{display:none}
.cl-svg[data-wire] .iso-line[data-tone="faint"]{stroke:var(--anatomy-lo)}

.cl-sheet{fill:var(--cl-glow);fill-opacity:var(--cl-glow-k);stroke:none;pointer-events:none}
.iso[data-theme="light"] .cl-sheet{mix-blend-mode:multiply}
.cl-scan{stroke:var(--cl-glow-line);stroke-width:1.1px}
.cl-lamp>.iso-solid>.iso-top,.cl-lamp>.iso-solid>.iso-shade{fill:color-mix(in srgb,var(--cl-glow) calc(var(--glow,0)*65%),var(--anatomy-top))}
.cl-led[data-on]>.iso-solid>.iso-top,.cl-led[data-on]>.iso-solid>.iso-shade{fill:var(--anatomy-lit-top)}
.cl-led[data-on]>.iso-solid>.iso-edge{stroke:var(--anatomy-lit)}
.cl-window{fill:var(--anatomy-shade-0);stroke:var(--anatomy-lo);stroke-width:.5px;vector-effect:non-scaling-stroke}
.cl-digits{fill:var(--anatomy-hi);font-family:var(--anatomy-mono);letter-spacing:.02em}
.cl-digits[data-dim]{fill:var(--anatomy-mid)}

.cl-panel{display:grid;gap:10px;margin:-14px 0 40px;font-size:13px;color:var(--anatomy-text)}
.cl-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.cl-set{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cl-btn{appearance:none;border:0;border-radius:0;background:var(--anatomy-card);color:var(--anatomy-text);box-shadow:0 0 0 1px var(--anatomy-faint);padding:6px 10px;font:inherit;font-size:12.5px;line-height:1.2;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.cl-btn span{font-family:var(--anatomy-mono);font-size:10.5px;color:var(--anatomy-muted)}
.cl-btn:hover{box-shadow:0 0 0 1px var(--anatomy-mid);color:var(--anatomy-strong)}
.cl-btn:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:3px}
.cl-btn[aria-pressed="true"]{box-shadow:0 0 0 1px var(--anatomy-hi);color:var(--anatomy-strong)}
.cl-follow[aria-pressed="true"]{background:var(--anatomy-strong);color:var(--anatomy-card)}
.cl-speed{display:inline-flex;gap:8px;align-items:center;font-size:12.5px}
.cl-speed input{width:120px;accent-color:var(--anatomy-hi)}
.cl-speed output{font-family:var(--anatomy-mono);font-size:11.5px;min-width:9.5em;font-variant-numeric:tabular-nums}
.cl-info{background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-faint);padding:12px 14px;display:grid;gap:4px;min-height:132px}
.cl-info-head{display:grid;gap:2px;margin-bottom:6px}
.cl-info-head b{color:var(--anatomy-strong);font-weight:600}
.cl-info-head span{color:var(--anatomy-muted)}
.cl-spec{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--anatomy-faint);padding-top:4px}
.cl-spec b{font-weight:500;color:var(--anatomy-strong);font-family:var(--anatomy-mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.cl-steps{display:flex;flex-wrap:wrap;gap:4px;list-style:none;margin:0 0 6px;padding:0}
.cl-steps li{padding:3px 8px;font-size:11.5px;box-shadow:0 0 0 1px var(--anatomy-faint);color:var(--anatomy-muted)}
.cl-steps li[data-done]{color:var(--anatomy-text)}
.cl-steps li[data-now]{box-shadow:0 0 0 1px var(--anatomy-hi);color:var(--anatomy-strong)}
.cl-note{margin:6px 0 0;color:var(--anatomy-muted)}
@media (max-width:560px){.cl-speed input{width:90px}.cl-info{min-height:170px}}

o-caption">Una hoja A4 (297 × 210 mm) sale del alimentador cada 3,2 s y viaja a 0,25 m/s sobre dos bandas. Bajo el escáner, una cámara de línea a 300 ppp lee 3 508 líneas en 1,19 s, a unas 2 950 líneas por segundo; el clasificador decide póliza o procedimiento y, si su confianza no llega al 80 %, la manda a revisión manual. Un tope neumático la retiene y el brazo SCARA, con eslabones de 260 y 230 mm, la recoge con cuatro ventosas y la deposita en su bandeja en 2,05 s, antes de que llegue la siguiente: 1 125 documentos por hora a velocidad nominal. Arrastra para girar la celda, haz clic en un mecanismo o usa 1–5 para inspeccionarlo, F para seguir un documento, + y − para la velocidad.</span></figcaption></figure><div class="cl-panel">

    return worst;
  };
  const sheet = (tone, levels) => {
    levels[0].groups.get(tone).forEach((arc, index) => {
      const chain = [arc];
      for (let k = 1; k < levels.length; k++) chain.push(align(chain[k - 1], levels[k].groups.get(tone)[index]));
      const last = levels.length - 1;
      const points = [...arcPoints(levels[0].i, levels[0].u, chain[0].from, chain[0].to)];
      for (let k = 1; k < last; k++) points.push(pointAt(levels[k].i, levels[k].u, chain[k].to));
      points.push(...arcPoints(levels[last].i, levels[last].u, chain[last].from, chain[last].to).reverse());
      for (let k = last - 1; k >= 1; k--) points.push(pointAt(levels[k].i, levels[k].u, chain[k].from));
      buckets[tone].push(pathOf(oriented(points), true));
    });
  };
  const overlap = (x, y) => Math.min(x.to, y.to) - Math.max(x.from, y.from);
  const strip = (tone, a, b) => {
    const below = a.groups.get(tone) ?? [];
    const above = (b.groups.get(tone) ?? []).map((arc) => ({ arc, used: false }));
    const quad = (lo, hi) => {
      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];
      buckets[tone].push(pathOf(oriented(points), true));
    };
    for (const arc of below) {
      let best = null;
      let score = -Infinity;
      for (const entry of above) {
        if (entry.used) continue;
        const aligned = align(arc, entry.arc);
        const value = overlap(arc, aligned);
        if (value > score) (score = value), (best = entry);
      }
      if (best && score > -0.05) {
        best.used = true;
        quad(arc, align(arc, best.arc));
      } else {
        const centre = (arc.from + arc.to) / 2;
        quad(arc, { from: centre, to: centre });
      }
    }
    for (const entry of above) {
      if (entry.used) continue;
      const centre = (entry.arc.from + entry.arc.to) / 2;
      quad({ from: centre, to: centre }, entry.arc);
    }
  };
  const k = scaleOf(P);
  let run = [];
  const flush = () => {
    const tones = [...new Set(run.flatMap((level) => [...level.groups.keys()]))].sort((x, y) => x - y);
    for (const tone of tones) {
      const countOf = (level) => (level.groups.get(tone) ?? []).length;
      let start = 0;
      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;
        if (at - 1 > start && countOf(run[start])) sheet(tone, run.slice(start, at));
        if (at < run.length) strip(tone, run[at - 1], run[at]);
        start = at;
      }
    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {
      flush();
      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);
    const refine = (a, b, depth) => {
      const mid = levelOf(i, (a.u + b.u) / 2);
      const split = depth < limit && (!same(a, b) || !same(a, mid) || (depth < 6 && strayOf(i, a, mid, b) > error));
      if (!split) {
        run.push(b);
        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const facing = Math.atan2(dot3(F.v, V), dot3(F.u, V));
  const [left, right] = silhouettePoints(side, F, P, { samples, slope });
  if (left.length <= samples || right.length <= samples) return null;
  const s0 = side[0][0];
  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const arc = (s, r, from, to, through) => {
    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));
    }
    seen.push(row);
    tones.push(toneRow);
  }
  const buckets = [[], [], [], [], []];
  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;
    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);
      const b = run.map((j) => rings[i + 1][j]).reverse();
      const d = pathOf(oriented([...a, ...b]), true);
      buckets[key].push(d);
      all.push(d);
    }
  }
  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);
    return ds > 0 ? [Math.max(-1, c), 1] : [-1, Math.min(1, c)];
  };
  const arcsOf = (ranges) => {
    if (ranges.some((range) => !range)) return [];
    const lo = Math.max(...ranges.map(([x]) => x));
    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;
    for (const arc of arcsOf([rangeOf(i - 1), rangeOf(i)])) creases.push(pathOf(along(meridian[i][0], meridian[i][1], arc)));
  }
  let bevelPath = "";
  if (bevel > 0 && m > 2) {
    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }
    }
  }
  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];

        put(`hang${hx}${hy}`, "escaner", planFp(hp), 108, 124, S(k.slabOf(hp, 108, 16, P, 2), { tone: "mid", crease: "none" }));
      }
      const head = box(-165, -11, -155, 11, 1.2);
      let hs = S(k.slabOf(head, 108, 16, P, 3, 0.5), { tone: "hi", crease: "lo", inner: L(k.sideSeam(head, 112, P, 3), { tone: "faint" }) });
      const fins = [];
      for (const sx of [-1, 1]) if (faces(sx, 0)) for (let y = -8; y <= 8; y += 4) fins.push(k.segment([sx > 0 ? -155 : -165, y, 113], [sx > 0 ? -155 : -165, y, 124], P));
      hs += L(fins.join(""), { tone: "lo" });
      put("head", "escaner", planFp(head), 108, 124, hs);
      put("lens", "escaner", circ(-160, 0, 3.2), 103, 108, S(k.cylinder(-160, 0, 3.2, 103, 5, P, 28), { tone: "mid", inner: L(k.sideArc(-160, 0, 3.2, 106, P, 18), { tone: "faint" }) }));
    }

    // ------------------------------------------------ SCARA base
    {
      const [cx, cy] = C.COL;
      const bolts = Array.from({ length: 8 }, (_, i) => [cx + 13 * Math.cos((i / 8) * Math.PI * 2 + 0.3), cy + 13 * Math.sin((i / 8) * Math.PI * 2 + 0.3)]);
      put("flange", "brazo", circ(cx, cy, 16), 0, 4, S(k.cylinder(cx, cy, 16, 0, 4, P, 40, 0.6), { tone: "mid" }) + L(k.ring(cx, cy, 13, 4, P, 48), { tone: "faint" }) + D(bolts.map(([x, y]) => at([x, y, 4])), { size: 0.55, tone: "mid" }));
      put("column", "brazo", circ(cx, cy, 11), 4, 96, S(k.cylinder(cx, cy, 11, 4, 92, P, 36), { tone: "mid", crease: "none", inner: L([30, 62].map((z) => k.sideArc(cx, cy, 11, z, P, 28)).join(""), { tone: "faint" }) }));
      put("j1", "brazo", circ(cx, cy, 13.5), 96, 104, S(k.cylinder(cx, cy, 13.5, 96, 8, P, 40, 0.6), { tone: "mid", inner: L(k.sideArc(cx, cy, 13.5, 99, P, 32), { tone: "faint" }) }) + L(k.knurl(cx, cy, 13.5, 98.4, 104, 40, P, 0.6), { tone: "lo" }));
    }

    // ------------------------------------------------ trays on pedestals
    C.TRAYS.forEach((t, ti) => {
      const [cx, cy] = t.at;
      const pl = box(cx - 28, cy - 19, cx + 28, cy + 19, 1.5);
      put(`plinth${ti}`, "bandejas", planFp(pl), 0, 3, S(k.slabOf(pl, 0, 3, P, 3, 0.5), { tone: "lo" }) + D(k.corners(pl, 3).map(([x, y]) => at([x, y, 3])), { size: 0.45 }));
      const co = box(cx - 22, cy - 14, cx + 22, cy + 14, 1.5);
      put(`ped${ti}`, "bandejas", planFp(co), 3, 47, S(k.slabOf(co, 3, 44, P, 3, 0.5), { tone: "mid", inner: L(k.sideSeam(co, 40, P, 3), { tone: "faint" }) }));
      const fl = box(cx - 34, cy - 25, cx + 34, cy + 25, 2);
      put(`tfloor${ti}`, "bandejas", planFp(fl), 47, 50, S(k.slabOf(fl, 47, 3, P, 4, 0.5), { tone: "mid" }) + L(k.planOutline(k.insetPlan(fl, 5), 50, P, 3), { tone: "faint" }));
      const walls = [box(cx - 34, cy - 25, cx + 34, cy - 23, 0.8), box(cx - 34, cy + 23, cx + 34, cy + 25, 0.8), box(cx - 34, cy - 23, cx - 32, cy + 23, 0.4), box(cx + 32, cy - 23, cx + 34, cy + 23, 0.4)];
      walls.forEach((w, wi) => {
        let svg = S(k.slabOf(w, 50, 12, P, 2, 0.3), { tone: "mid" });
        if (wi < 2) svg += D([at([w.x + 3, w.y + 1, 62]), at([w.x + w.w - 3, w.y + 1, 62])], { size: 0.4 });
        put(`wall${ti}${wi}`, "bandejas", planFp(w), 50, 62, svg);
      });
      const [ox, oy] = t.out;
      const lc = [cx + ox * 36, cy + oy * 36];
      const lp = ox ? box(lc[0] - 4.5, lc[1] - 24, lc[0] + 4.5, lc[1] + 24, 1) : box(lc[0] - 24, lc[1] - 4.5, lc[0] + 24, lc[1] + 4.5, 1);
      let ls = S(k.slabOf(lp, 0, 0.8, P, 3), { tone: "lo" }) + L(k.planOutline(k.insetPlan(lp, 1.2), 0.8, P, 3), { tone: "faint" });
      ls += k.faceTextSvg(readTop([lc[0], lc[1], 0.8]) + " translate(0 1.6)", t.label, { size: t.label.length > 10 ? 4 : 5, tone: "hi", anchor: "middle" });
      put(`label${ti}`, "bandejas", planFp(lp), 0, 0.8, ls);
    });

    // ------------------------------------------------ control cabinet
    {
      const pl = box(68, -122, 142, -94, 1.5);
      put("cplinth", "control", planFp(pl), 0, 4, S(k.slabOf(pl, 0, 4, P, 3, 0.5), { tone: "lo" }));
      const bd = box(70, -120, 140, -96, 1.5);
      let svg = S(k.slabOf(bd, 4, 72, P, 3, 0.8), { tone: "mid", inner: L(k.sideSeam(bd, 70, P, 3), { tone: "faint" }) });
      if (faces(0, 1)) {
        svg += L(faceRect([73, -96, 72], [0, 1], 64, 62), { tone: "lo" });
        svg += D([at([74.5, -96, 66]), at([74.5, -96, 18])], { size: 0.45 });
        svg += L(faceRect([80, -96, 64], [0, 1], 22, 9), { tone: "faint" });
      }
      if (faces(0, -1)) svg += L(faceRect([137, -120, 72], [0, -1], 64, 62), { tone: "faint" });
      for (const sx of [-1, 1]) if (faces(sx, 0)) {
        const x = sx > 0 ? 140 : 70;
        const vents = [];
        for (let i = 0; i < 6; i++) vents.push(faceRect([x, sx > 0 ? -102 - 0 : -114, 64 - i * 4.5], [sx, 0], 12, 1.6));
        svg += L(vents.join(""), { tone: "lo" });
      }
      put("cabinet", "control", planFp(bd), 4, 76, svg);
      const hp = box(127, -96, 129.5, -94.4, 0.5);
      put("handle", "control", planFp(hp), 34, 50, S(k.slabOf(hp, 34, 16, P, 2), { tone: "mid" }));
      put("estopbase", "control", circ(82, -110, 4.5), 76, 79, S(k.cylinder(82, -110, 4.5, 76, 3, P, 28), { tone: "mid" }));
      put("estop", "control", circ(82, -110, 5.2), 79, 82.5, S(k.cylinder(82, -110, 5.2, 79, 3.5, P, 32, 0.5), { tone: "hi", crease: "lo" }) + L(k.ring(82, -110, 3, 82.5, P, 24), { tone: "faint" }));
      put("lightpost", "control", circ(132, -112, 1.4), 76, 86, S(k.cylinder(132, -112, 2.6, 76, 1.5, P, 20), { tone: "mid" }) + S(k.cylinder(132, -112, 1.4, 77.5, 8.5, P, 16), { tone: "mid", crease: "none" }));
    }
    return out;
  }

  // ---------------------------------------------------------------- moving parts
  function docSvg(P, d, x, y, z, { lit = false, scan = 1 } = {}) {
    const { S, L, D, at } = tools(P);
    const { L: DL, W } = C.DOC;
    const top = z + C.DOC.T;
    const plan = { x: x - DL / 2, y: y - W / 2, w: DL, d: W, r: 0.8 };
    const skew = d.cls === 2 ? 0.1 : 0;
    const P2 = (u, v) => [x + u + v * skew, y + v];
    const read = (u) => (u + DL / 2) / DL <= scan + 1e-6;
    const rows = { read: [], unread: [] };
    const row = (u, v0, v1) => rows[read(u) ? "read" : "unread"].push(k.onTop([P2(u, v0), P2(u, v1)], top, P));
    const dots = [];
    let boxes = "";
    if (d.kind === 0) {
      boxes += k.onTop([P2(-26, -17), P2(-20, -17), P2(-20, -11), P2(-26, -11)], top, P, true);
      row(-23, -8, 14);
      [-15, -11, -7, -3, 1, 5, 9, 13].forEach((u, i) => {
        row(u, -17, -4 + ((i * 5) % 3));
        row(u, 2, 9 + ((i * 7) % 8));
      });
      row(22, 4, 16);
      boxes += k.ring(x + 22, y - 10, 4, top, P, 18);
    } else {
      row(-24, -17, 10);
      for (let i = 0; i < 8; i++) {
        const u = -17 + i * 4.4;
        dots.push(at([...P2(u, -16), top]));
        row(u, -13, 6 + ((i * 11 + d.n) % 11));
      }
      boxes += k.onTop([P2(19, -17), P2(26, -17), P2(26, 17), P2(19, 17)], top, P, true) + k.onTop([P2(22.5, -17), P2(22.5, 17)], top, P);
    }
    if (d.cls === 2) boxes += k.onTop(Array.from({ length: 22 }, (_, i) => P2(12 + 4.5 * Math.cos((i / 22) * Math.PI * 2), 10 + 4.5 * Math.sin((i / 22) * Math.PI * 2))), top, P, true);
    let svg = S(k.slabOf(plan, z, C.DOC.T, P, 2), { tone: lit ? "hi" : "mid", lit, crease: "none" });
    svg += L(boxes, { tone: "lo" });
    svg += L(rows.read.join(""), { tone: lit ? "hi" : "mid", free: true }) + L(rows.unread.join(""), { tone: "faint", free: true });
    if (dots.length) svg += D(dots, { size: 0.45, tone: "mid" });
    return svg;
  }

  // Geometry that only changes with the camera (roller barrels, belt slabs, stacks).
  let memoKey = "";
  let memo = new Map();
  const once = (P, key, make) => {
    const pk = `${P.azimuth}|${P.elevation}|${P.scale}|${P.origin[0]}|${P.origin[1]}`;
    if (pk !== memoKey) { memoKey = pk; memo = new Map(); }
    if (!memo.has(key)) memo.set(key, make());
    return memo.get(key);
  };

  function dynamicItems(P, M, opt = {}) {
    const { S, L, D, at, faceM, faces, faceRect } = tools(P);
    const out = [];
    const put = (...args) => out.push(item(...args));

    // Rollers turn with the belt: the ribs are the flats of a knurled tube.
    C.ROLLERS.forEach((x, i) => {
      const F = G.frameOf([x, 0, RZ], [0, 1, 0], [1, 0, 0], [0, 0, 1]);
      const svg = once(P, `roller${i}`, () => S(G.disc(-29, 29, C.ROLLER_R, F, P, { steps: 32 }), { tone: "mid" })) + k.fadedSvg(G.ribsOf(F, -29, 29, C.ROLLER_R, 8, P, { phase: -M.roll, fade: [0.12, 0.6] }), { tone: "lo" });
      put(`roller${i}`, "cinta", rect(x - 4, -29, x + 4, 29), RZ - 4, RZ + 4, svg);
    });
    C.DRUMS.forEach((x, i) => {
      const F = G.frameOf([x, 0, DZ], [0, 1, 0], [1, 0, 0], [0, 0, 1]);
      const svg = once(P, `drum${i}`, () => S(G.disc(-27, 27, C.DRUM_R, F, P, { steps: 40 }), { tone: "mid" })) + k.fadedSvg(G.ribsOf(F, -27, 27, C.DRUM_R, 12, P, { phase: -M.drum, fade: [0.12, 0.6] }), { tone: "lo" });
      put(`drum${i}`, "cinta", rect(x - C.DRUM_R, -27, x + C.DRUM_R, 27), DZ - C.DRUM_R, DZ + C.DRUM_R, svg);
    });
    // Twin flat belts, with the splice and cleat marks travelling along.
    for (const sy of [-1, 1]) {
      const bp = box(C.DRUMS[0], sy * 9, C.DRUMS[1], sy * 21, 0.5);
      let svg = once(P, `belt${sy}`, () => S(k.slabOf(bp, BT - C.BELT_T, C.BELT_T, P, 2), { tone: "lo", crease: "none" }));
      const marks = [];
      const pitch = 20;
      const off = ((M.travel % pitch) + pitch) % pitch;
      for (let s = C.DRUMS[0] + off; s < C.DRUMS[1]; s += pitch) marks.push(k.lineOnTop([s, sy * 9], [s, sy * 21], BT, P));
      svg += L(marks.join(""), { tone: "faint" });
      put(`belt${sy}`, "cinta", planFp(bp), BT - C.BELT_T, BT, svg, 2);
    }
    // Magazine stack: sheets waiting above the next one on the belt.
    {
      const count = 44 - (((M.cycle % 24) + 24) % 24);
      const h = count * 0.42;
      const z0 = BT + C.DOC.T;
      const sp = { x: C.WAIT_X - 30, y: -21, w: 60, d: 42, r: 0.8 };
      const svg = once(P, `mag${count}`, () => {
        const seams = [];
        for (let z = z0 + 1.2; z < z0 + h - 0.5; z += 1.2) seams.push(k.sideSeam(sp, z, P, 2));
        const rows = [];
        for (let u = -22; u <= 22; u += 5) rows.push(k.onTop([[C.WAIT_X + u, -15], [C.WAIT_X + u, 2 + ((u * 7 + 60) % 13)]], z0 + h, P));
        return S(k.slabOf(sp, z0, h, P, 2), { tone: "mid", crease: "none", inner: L(seams.join(""), { tone: "faint" }) }) + L(rows.join(""), { tone: "faint", free: true });
      });
      put("magstack", "cinta", planFp(sp), z0, z0 + h, svg);
    }
    // Eye LEDs.
    C.EYES.forEach((ex, i) => {
      const on = M.eyes[i];
      put(`led${ex}`, "cinta", circ(ex, -15.5, 1), FR.z1 + 10, FR.z1 + 11, once(P, `led${ex}${on}`, () => `<g class="cl-led"${on ? " data-on" : ""}>${S(k.cylinder(ex, -15.5, 1, FR.z1 + 10, 1, P, 14), { tone: on ? "hi" : "lo", crease: "none" })}</g>`));
    });

    // Documents. The followed one, or else the newest classified one, is the lit accent.
    const litN = opt.follow ?? (M.decided ? M.decided.n : M.scanning ? M.scanning.n : -1);
    for (const d of M.docs) {
      const z = d.z;
      const svg = docSvg(P, d, d.x, d.y, z, { lit: d.n === litN, scan: d.since < 0 ? 0 : d.scan });
      put(`doc${d.n}`, d.held ? "brazo" : "cinta", rect(d.x - 30, d.y - 21, d.x + 30, d.y + 21), z, z + C.DOC.T, `<g data-doc="${d.n}">${svg}</g>`, 1);
    }

    // Scanner light: two sheets from the line lights meeting on the scan line.
    {
      const a = M.light;
      const lz = BT + C.DOC.T + 0.05;
      const sheet = (x0) => `<path class="cl-sheet" style="opacity:${(0.1 + 0.5 * a).toFixed(3)}" d="${k.pathOf([at([x0, -21, 102]), at([x0, 21, 102]), at([C.SCAN_X, 21, lz]), at([C.SCAN_X, -21, lz])], true)}"/>`;
      put("sheetA", "escaner", rect(-166, -21, C.SCAN_X, 21), lz + 0.01, 102, sheet(-166), 5);
      put("sheetB", "escaner", rect(C.SCAN_X, -21, -154, 21), lz + 0.01, 102, sheet(-154), 5);
      put("scanline", "escaner", rect(C.SCAN_X - 0.3, -21, C.SCAN_X + 0.3, 21), lz, lz + 0.001, `<path class="iso-line cl-scan" style="opacity:${(0.35 + 0.65 * a).toFixed(3)}" d="${k.lineOnTop([C.SCAN_X, -21], [C.SCAN_X, 21], lz, P)}"/>`, 6);
      for (const [i, x0] of [[0, -170], [1, -154]]) {
        const bp = box(x0, -24, x0 + 4, 24, 0.6);
        put(`lamp${i}`, "escaner", planFp(bp), 102, 108, `<g class="cl-lamp" style="--glow:${a.toFixed(3)}">${once(P, `lamp${i}`, () => S(k.slabOf(bp, 102, 6, P, 2, 0.3), { tone: "mid" }))}</g>`);
      }
      // Display on whichever tower face the reader can see.
      for (const sy of [-1, 1]) {
        if (!faces(0, sy)) continue;
        const o = [sy > 0 ? -166 : -154, sy * 48.05, 108];
        let text = "LISTO";
        let sub = "300 ppp";
        if (M.scanning) { text = `LEE ${Math.round(M.scanning.scan * 100)}%`; sub = `${Math.round(M.scanning.scan * C.LINES)} lín`; }
        else if (M.decided) { text = ["PÓL", "PRO", "REV"][M.decided.cls] + " " + M.decided.conf.toFixed(2); sub = M.decided.id; }
        const svg = `<g transform="${faceM(o, [0, sy])}"><text class="cl-digits" x="6" y="6.2" font-size="3.4" text-anchor="middle">${text}</text><text class="cl-digits" data-dim x="6" y="11" font-size="2.6" text-anchor="middle">${sub}</text></g>`;
        put(`display${sy}`, "escaner", rect(-166, sy * 48, -154, sy * 48.3), 94, 108, svg, 1);
      }
    }

    // SCARA links, quill and vacuum head, posed from the model's joints.
    {
      const [cx, cy] = C.COL;
      const { e, w } = M;
      const r1 = stadium([cx, cy], e, 11);
      let s1 = S(k.extrude(r1, 104, 8, P, { bevel: 0.6 }), { tone: "hi", crease: "lo" });
      s1 += L(k.onTop(stadium([cx, cy], e, 7.5), 112, P, true), { tone: "faint" });
      s1 += L(k.ring(cx, cy, 4, 112, P, 20), { tone: "lo" }) + D([at([cx, cy, 112])], { size: 0.5, tone: "hi" });
      put("link1", "brazo", r1, 104, 112, s1);
      const r2 = stadium(e, w, 9);
      let s2 = S(k.extrude(r2, 112, 7, P, { bevel: 0.5 }), { tone: "hi", crease: "lo" });
      s2 += L(k.onTop(stadium(e, w, 6), 119, P, true), { tone: "faint" });
      put("link2", "brazo", r2, 112, 119, s2);
      put("elbow", "brazo", circ(e[0], e[1], 7), 119, 123, S(k.cylinder(e[0], e[1], 7, 119, 4, P, 32, 0.4), { tone: "mid" }) + L(k.ring(e[0], e[1], 4.5, 123, P, 24), { tone: "faint" }) + D([at([e[0], e[1], 123])], { size: 0.5 }));
      put("wrist", "brazo", circ(w[0], w[1], 8), 119, 135, S(k.cylinder(w[0], w[1], 8, 119, 16, P, 36, 0.5), { tone: "mid", inner: L(k.sideArc(w[0], w[1], 8, 123, P, 24), { tone: "faint" }) }) + L(k.knurl(w[0], w[1], 8, 122.4, 135, 28, P, 0.6), { tone: "lo" }) + L(k.ring(w[0], w[1], 3.6, 135, P, 20), { tone: "faint" }));
      const cupsBottom = M.z;
      const headZ = cupsBottom + C.CUP_H;
      const headTop = headZ + C.HEAD_H;
      const shaftTop = headTop + 66;
      if (shaftTop > 135) put("shaftUp", "brazo", circ(w[0], w[1], 2.4), 135, shaftTop, S(k.cylinder(w[0], w[1], 2.4, 135, shaftTop - 135, P, 18), { tone: "hi", crease: "none" }) + S(k.cylinder(w[0], w[1], 3, shaftTop, 1.4, P, 18), { tone: "mid" }));
      put("shaftDn", "brazo", circ(w[0], w[1], 2.4), headTop, 112, S(k.cylinder(w[0], w[1], 2.4, headTop + 2, 110 - headTop, P, 18), { tone: "hi", crease: "none" }) + S(k.cylinder(w[0], w[1], 3.6, headTop, 2, P, 22), { tone: "mid" }));
      const hp = box(w[0] - 15, w[1] - 11, w[0] + 15, w[1] + 11, 1.4);
      put("vhead", "brazo", planFp(hp), headZ, headTop, S(k.slabOf(hp, headZ, C.HEAD_H, P, 3, 0.4), { tone: "mid" }) + D(k.corners(hp, 2.4).map(([x, y]) => at([x, y, headTop])), { size: 0.4 }));
      put("vfit", "brazo", circ(w[0] + 9, w[1] + 6, 1.8), headTop, headTop + 3, `<g class="cl-led"${M.vacuum ? " data-on" : ""}>${S(k.cylinder(w[0] + 9, w[1] + 6, 1.8, headTop, 3, P, 16), { tone: M.vacuum ? "hi" : "mid" })}</g>`);
      const cups = [[-10, -6], [10, -6], [-10, 6], [10, 6]].map(([dx, dy]) => [w[0] + dx, w[1] + dy]);
      const csvg = cups
        .sort((a, b) => k.depthOf([a[0], a[1], 0], P) - k.depthOf([b[0], b[1], 0], P))
        .map(([x, y]) => S(k.cylinder(x, y, 3, cupsBottom, 1.6, P, 22), { tone: "mid" }) + S(k.cylinder(x, y, 1.6, cupsBottom + 1.6, 1.4, P, 16), { tone: "mid", crease: "none" }))
        .join("");
      put("cups", "brazo", rect(w[0] - 13, w[1] - 9, w[0] + 13, w[1] + 9), cupsBottom, headZ, csvg);
    }

    // Stacks in the trays grow with each drop.
    C.TRAYS.forEach((t, ti) => {
      const [cx, cy] = t.at;
      const top = M.stacks[ti];
      const h = top - C.TRAY_FLOOR;
      if (h < 0.3) return;
      const sp = { x: cx - 30, y: cy - 21, w: 60, d: 42, r: 0.8 };
      const svg = once(P, `stack${ti}|${top}`, () => {
      const seams = [];
      for (let z = C.TRAY_FLOOR + 1; z < top - 0.4; z += 1) seams.push(k.sideSeam(sp, z, P, 2));
      let svg = S(k.slabOf(sp, C.TRAY_FLOOR, h, P, 2), { tone: "mid", crease: "none", inner: L(seams.join(""), { tone: "faint" }) });
      const rows = [];
      for (let u = -20; u <= 20; u += 5) rows.push(k.onTop([[cx + u, cy - 15], [cx + u, cy + 4 + ((u * 7 + 40) % 11)]], top, P));
      svg += L(rows.join(""), { tone: "faint", free: true });
      return svg;
      });
      put(`stack${ti}`, "bandejas", planFp(sp), C.TRAY_FLOOR, top, svg);
    });

    // Stack light: green running, amber paused.
    {
      const run = !opt.paused;
