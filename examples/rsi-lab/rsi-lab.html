<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anatomía de la automejora recursiva</title>
<meta name="description" content="Experiencia interactiva: del Transformer al sistema que mejora cómo se mejora. Cálculos locales verificables, simulaciones conceptuales declaradas.">
<style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

.iso{
  --bg:#0a0b0d;--panel:#111216;--panel-2:#16181d;--line:#24272e;--line-2:#30343c;
  --ink:#e7e8ea;--ink-2:#b6b9bf;--ink-3:#868a92;--ink-4:#5d6168;
  --c-in:#47c9dd;--c-w:#ab8dff;--c-g:#ff9b3f;--c-ok:#4fd383;--c-bad:#ff6a6a;--c-off:#7a7f88;
  --anatomy-paper:#0f1013;--anatomy-card:#0f1013;--anatomy-face:#191b20;--anatomy-top:#1b1d22;
  --anatomy-shade-0:#0d0e11;--anatomy-shade-1:#111215;--anatomy-shade-2:#14161a;--anatomy-shade-3:#17191e;
  --anatomy-lit-top:#262931;--anatomy-lit-shade:#1d2026;
  --anatomy-hi:#d7d9dd;--anatomy-mid:#6b6f77;--anatomy-lo:#3d4047;--anatomy-faint:#272a30;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink-2);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1.5px solid var(--c-in);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{display:grid;grid-template-rows:44px 1fr auto;grid-template-columns:1fr auto;height:100vh;height:100dvh}
.top{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel);min-width:0}
.brand{color:var(--ink);font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.brand small{color:var(--ink-3);font-weight:400;margin-left:8px}
.top .spacer{flex:1}
.chapter-menu{position:relative;flex:0 1 auto;min-width:0}
.chapter-btn{display:flex;align-items:center;gap:8px;max-width:100%;border:1px solid var(--line-2);background:transparent;border-radius:6px;height:28px;padding:0 10px 0 4px;color:var(--ink-2);font-size:12.5px;min-width:0}
.chapter-btn:hover{border-color:var(--ink-4);color:var(--ink)}
.chapter-btn .n,.chapter-list .n{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:4px;background:var(--panel-2);font:11px var(--mono);color:var(--ink);flex:none}
.chapter-btn .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chapter-btn .caret{color:var(--ink-3);font-size:10px}
.chapter-list{position:absolute;left:0;top:34px;z-index:20;list-style:none;margin:0;padding:6px;min-width:320px;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;box-shadow:0 14px 40px #000c}
.chapter-list button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:6px 8px;border-radius:5px;color:var(--ink-2);font-size:13px;text-align:left}
.chapter-list button:hover,.chapter-list button:focus-visible{background:var(--panel-2);color:var(--ink)}
.chapter-list button[aria-current="true"]{color:var(--ink)}
.chapter-list button[aria-current="true"] .n{background:#47c9dd33}
.chapter-list button.done .n{color:var(--ink-3)}
.icon-btn{border:1px solid var(--line-2);background:transparent;border-radius:5px;height:26px;min-width:26px;padding:0 8px;color:var(--ink-2);font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.icon-btn:hover{border-color:var(--ink-4);color:var(--ink)}
.icon-btn[aria-pressed="true"]{border-color:var(--c-in);color:var(--ink)}

.stage{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#121318 0%,#0d0e11 60%,#0a0b0d 100%);touch-action:none;min-width:0;min-height:0}
.stage svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.stage svg.scene.grabbing{cursor:grabbing}
.labels{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font:11px/1.25 var(--mono);color:var(--ink-2);will-change:transform}
.lbl>span{display:inline-block;transform:translate(-50%,-100%);padding:2px 6px;border-radius:3px;background:#0b0c0fcc;border:1px solid var(--line-2)}
.lbl.tag>span{border-color:transparent;background:#0b0c0fb0;color:var(--ink-2)}
.lbl.name>span{color:var(--ink);border-color:var(--line-2);letter-spacing:.02em}
.lbl.num>span{transform:translate(-50%,-50%);background:transparent;border:0;padding:0;font-size:10px;color:var(--ink);text-shadow:0 0 3px #000,0 0 2px #000}
.lbl.num.small>span{font-size:8.5px}
.lbl.note>span{white-space:normal;width:max-content;max-width:230px;font:12px/1.35 var(--sans);color:var(--ink-2)}
.lbl.left>span{transform:translate(-100%,-50%)}
.lbl.right>span{transform:translate(8px,-50%)}
.lbl.below>span{transform:translate(-50%,6px)}
.lbl[data-r="in"]>span{border-color:#47c9dd66;color:#bfeef5}
.lbl[data-r="w"]>span{border-color:#ab8dff66;color:#ddd0ff}
.lbl[data-r="g"]>span{border-color:#ff9b3f77;color:#ffd6ad}
.lbl[data-r="ok"]>span{border-color:#4fd38377;color:#c6f2d7}
.lbl[data-r="bad"]>span{border-color:#ff6a6a77;color:#ffcfcf}
.lbl[data-r="off"]>span{border-color:#7a7f8855;color:#a9adb4}

[data-obj]{transition:opacity .35s}
.scene[data-focus] [data-obj]:not([data-on]){opacity:.3}
.scene[data-focus] [data-obj][data-on] .iso-edge{stroke:var(--anatomy-lit)}
[data-obj].pick{cursor:pointer}
[data-obj][data-sel] .iso-edge,[data-obj][data-sel] .mx-frame{stroke:var(--c-in)!important;stroke-width:1.1}
@media (prefers-reduced-motion:reduce){[data-obj]{transition:none}}

[data-role="w"] .iso-top{fill:#211d2d}[data-role="w"] .iso-edge{stroke:#7d6bb0}
[data-role="in"] .iso-top{fill:#16252a}[data-role="in"] .iso-edge{stroke:#3b8f9c}
[data-role="g"] .iso-top{fill:#2a2016}[data-role="g"] .iso-edge{stroke:#b06d2f}
[data-role="off"] .iso-top{fill:#1a1b1e}[data-role="off"] .iso-edge{stroke:#4a4d54}
[data-role="ok"] .iso-top{fill:#16271e}[data-role="ok"] .iso-edge{stroke:#3a9a62}
[data-role="bad"] .iso-top{fill:#2b1718}[data-role="bad"] .iso-edge{stroke:#b04a4a}

.lamp[data-state="ok"] .iso-top{fill:var(--c-ok)}.lamp[data-state="ok"] .iso-edge{stroke:var(--c-ok)}
.lamp[data-state="fail"] .iso-top{fill:var(--c-bad)}.lamp[data-state="fail"] .iso-edge{stroke:var(--c-bad)}
.lamp[data-state="off"] .iso-top{fill:#22252b}
.lamp[data-state="ok"],.lamp[data-state="fail"]{filter:drop-shadow(0 0 4px currentColor)}
.lamp[data-state="ok"]{color:#4fd38399}.lamp[data-state="fail"]{color:#ff6a6a99}

.mx-plate{fill:#121419;stroke:none}
.mx-edge{fill:#08090b;stroke:none}
.mx-frame{fill:none;stroke:var(--anatomy-mid);stroke-width:.7}
.mx-cells{--rc:var(--c-in)}
.mx-cells[data-role="w"]{--rc:var(--c-w)}
.mx-cells[data-role="g"]{--rc:var(--c-g)}
.mx-cells[data-role="ok"]{--rc:var(--c-ok)}
.mx-cells[data-role="bad"]{--rc:var(--c-bad)}
.mx-cells[data-role="off"]{--rc:var(--c-off)}
.cell{stroke:none}
.cell.pos{fill:var(--rc);fill-opacity:var(--a)}
.cell.neg{fill:var(--rc);fill-opacity:calc(var(--a) * .22);stroke:var(--rc);stroke-opacity:calc(.25 + var(--a) * .75);stroke-width:.8}
.cell.empty{fill:#1a1c21}
.cell.mask{fill:#1d1f24;stroke:#3a3d44;stroke-width:.5}
.mask-mark{stroke:#4a4d55;stroke-width:.6;fill:none}
.cell.pending{fill:#17191d!important;fill-opacity:1!important;stroke:#2a2d33!important;stroke-opacity:1!important}
.cell.dim{opacity:.25}
.cell.rowhi,.cell.colhi{stroke:#e8f9ff;stroke-width:.9;stroke-opacity:.9}
.cell.hl{stroke:#fff;stroke-width:1.6;stroke-opacity:1}
.cell[data-cell]{cursor:pointer}
.cube-edge{fill:none;stroke:#3a3e46;stroke-width:.6}
.prod{stroke:none}
.prod.pos{fill:var(--c-in)}
.prod.neg{fill:none;stroke:var(--c-in);stroke-width:.9}
.prod.pending{opacity:.15}
.prod-ray{fill:none;stroke:#9fe4ef;stroke-opacity:.35;stroke-width:.6}
.prod-sum{fill:none;stroke:#e8f9ff;stroke-opacity:.6;stroke-width:.9}

.route{fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.route[data-loop="1"]{stroke:var(--c-in)}
.route[data-loop="2"]{stroke:var(--c-g);stroke-dasharray:6 3}
.route[data-loop="3"]{stroke:#e7e8ea;stroke-dasharray:1.2 3.2;stroke-width:1.8}
.route-bed{fill:none;stroke:#0b0c0f;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.route.off{stroke:var(--c-off);opacity:.35}
.route-port{fill:var(--anatomy-paper);stroke-width:1}
.route-ends[data-loop="1"] .route-port{stroke:var(--c-in)}
.route-ends[data-loop="2"] .route-port{stroke:var(--c-g)}
.route-ends[data-loop="3"] .route-port{stroke:#e7e8ea}
.route-ends[data-off] .route-port{stroke:var(--c-off);opacity:.5}
.pulse{filter:drop-shadow(0 0 3px currentColor)}
.pulse circle{fill:currentColor}
.pulse[data-r="in"]{color:var(--c-in)}.pulse[data-r="g"]{color:var(--c-g)}.pulse[data-r="w"]{color:var(--c-w)}
.pulse[data-r="ok"]{color:var(--c-ok)}.pulse[data-r="bad"]{color:var(--c-bad)}.pulse[data-r="hi"]{color:#e7e8ea}
.wire{fill:none;stroke-width:.9}
.wire[data-r="in"]{stroke:var(--c-in)}.wire[data-r="w"]{stroke:var(--c-w)}.wire[data-r="g"]{stroke:var(--c-g)}
.wire[data-r="ok"]{stroke:var(--c-ok)}.wire[data-r="bad"]{stroke:var(--c-bad)}.wire[data-r="off"]{stroke:var(--c-off)}
.bar{stroke:none}
.bar[data-r="in"]{fill:var(--c-in)}.bar[data-r="w"]{fill:var(--c-w)}.bar[data-r="g"]{fill:var(--c-g)}
.bar[data-r="ok"]{fill:var(--c-ok)}.bar[data-r="bad"]{fill:var(--c-bad)}.bar[data-r="off"]{fill:var(--c-off)}
.needle[data-tone]{stroke:#fff}

.hud{position:absolute;pointer-events:none;z-index:3}
.hud *{pointer-events:auto}
.rail{left:10px;top:12px;display:flex;flex-direction:column;gap:10px}
.changed{display:flex;flex-direction:column;gap:2px;align-items:stretch}
.changed .h{font:9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);margin-bottom:3px}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;border:1px solid var(--line-2);background:#0e0f12d9;font:11px var(--sans);color:var(--ink-3)}
.changed .chip{height:17px;padding:0;border:0;background:transparent;border-radius:0;font-size:10.5px;gap:6px}
.changed .chip b{font-weight:400;min-width:84px}
.changed .chip em{font-size:9.5px;color:var(--ink-4)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c-off);font-style:normal;flex:none}
.chip[data-s="cambió"]{color:#ffd6ad;border-color:#ff9b3f88}
.changed .chip[data-s="cambió"] em{color:#ffb877}
.changed .chip[data-s="activo"] em{color:#8fdbe8}
.chip[data-s="cambió"] i{background:var(--c-g);box-shadow:0 0 6px var(--c-g)}

.desk{left:10px;bottom:10px;width:300px;max-height:calc(100% - 200px);overflow:auto;background:#0e0f12eb;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;display:none}

.pl-toggle{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:0;font:600 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);text-align:left;min-width:0}

.plane h4{margin:0 0 6px;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);display:flex;gap:8px;align-items:center}

.formula .in{color:var(--c-in)}.formula .w{color:var(--c-w)}.formula .g{color:var(--c-g)}.formula .ok{color:var(--c-ok)}.formula .bad{color:var(--c-bad)}.formula .off{color:var(--c-off)}

.tbl{width:100%;border-collapse:collapse;font:11.5px var(--mono)}

.tbl td{text-align:right;padding:2px 6px;color:var(--ink-2);border-bottom:1px solid #1a1c21}

.prov[data-p="cita"]::before{content:"";width:6px;height:6px;background:none;border:1px solid var(--ink-2);border-radius:1px}
.prov[data-p="sim"]::before{content:"";width:6px;height:6px;border:1px dashed var(--ink-2);border-radius:50%}
.prov[data-p="ilus"]::before{content:"";width:6px;height:2px;background:var(--ink-3)}
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:10px var(--mono);fill:var(--ink-3)}
.chart .ax{stroke:var(--line-2);stroke-width:1;fill:none}

.legend{display:flex;gap:12px;flex-wrap:wrap;font:11px var(--sans);color:var(--ink-3);margin-top:4px}

.tip.pinned{pointer-events:auto;padding:0;border:0;background:transparent;box-shadow:none;max-width:300px}

.link{border:0;background:transparent;padding:0;color:#9fdbe6;font-size:12.5px;border-bottom:1px solid #9fdbe644}
.link:hover,.link[aria-pressed="true"]{color:#e8f9ff;border-bottom-color:#9fdbe6}
.tip{position:absolute;z-index:6;pointer-events:none;background:#0b0c0ff2;border:1px solid var(--line-2);border-radius:6px;padding:8px 10px;font:11.5px/1.45 var(--mono);color:var(--ink-2);max-width:340px;display:none;box-shadow:0 8px 24px #000a}
.tip.on{display:block}
.tip .tt{font:600 11px var(--mono);color:var(--ink);margin-bottom:3px}

.inspector{grid-row:2;grid-column:2;width:400px;border-left:1px solid var(--line);background:var(--panel);overflow:auto;display:flex;flex-direction:column;min-height:0}
.inspector[hidden]{display:none}
.insp-tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}

.insp-body h2{margin:0 0 2px;font-size:15px;color:var(--ink);font-weight:600}

.io{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px}
.io dt{color:var(--ink-3)}
.io dd{margin:0}
.io button{border:1px solid var(--line-2);background:transparent;border-radius:4px;padding:0 6px;margin:0 4px 3px 0;font:11px var(--mono);color:var(--ink-2)}

details{border-top:1px solid var(--line);padding-top:8px;margin-top:10px}
details summary{cursor:pointer;color:var(--ink-2);font-size:12px}
.refs a{color:#9fdbe6;text-decoration:none;border-bottom:1px solid #9fdbe633}
.refs a:hover{border-bottom-color:#9fdbe6}
.checks li{list-style:none;margin-left:-18px;font-size:12px}
.checks li::before{content:"✓ ";color:var(--c-ok)}
.checks li.x::before{content:"✗ ";color:var(--c-bad)}
.kv{font:11.5px var(--mono);color:var(--ink-2)}

.transport{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line);background:var(--panel);min-width:0}
.transport .grp{display:flex;gap:4px;align-items:center;flex:none}
.play{width:34px!important;height:30px!important;border-color:var(--ink-4)!important;color:var(--ink)!important}
.timeline{flex:1;position:relative;height:30px;min-width:120px;cursor:pointer}
.timeline .track{position:absolute;left:0;right:0;top:13px;height:4px;background:#1c1e23;border-radius:2px}
.timeline .fill{position:absolute;left:0;top:13px;height:4px;background:var(--c-in);border-radius:2px;width:0}
.timeline .tick{position:absolute;top:9px;width:1px;height:12px;background:var(--line-2)}
.timeline .ev{position:absolute;top:14px;width:2px;height:2px;background:#5d6168}
.timeline .num{position:absolute;top:-1px;font:9.5px var(--mono);color:var(--ink-4);transform:translateX(3px)}
.timeline .head{position:absolute;top:8px;width:2px;height:14px;background:#fff;border-radius:1px}

@media (max-width:1100px){.inspector{width:340px}.guide .g-text{font-size:15px}.chapter-btn .t{max-width:220px}}
@media (max-width:760px){
  #app{grid-template-rows:auto 1fr auto}

  .brand small{display:none}
  .chapter-menu{flex:1 1 auto}
  .chapter-list{min-width:0;width:calc(100vw - 16px)}
  .rail{left:6px;top:6px}
  .changed .h{display:none}
  .changed .chip{height:14px;font-size:9.5px}
  .changed .chip b{min-width:72px}
  .changed .chip[data-s="fijo"]{display:none}
  .rail{padding:4px 7px}
  .theta .note{display:none}
  .scalemap{right:6px;bottom:6px;gap:4px}
  .scalemap .camtools .icon-btn:nth-child(-n+2){display:none}
  .scales button{padding:3px 6px;font-size:10.5px}
  .caption{left:8px;right:8px;bottom:40px;width:auto;transform:none;text-align:left}
  .caption .txt{font-size:12.5px}
  .planes{position:absolute;left:8px;right:8px;bottom:8px;max-height:45%;overflow:auto;display:flex;flex-direction:column;align-items:flex-start;gap:6px;z-index:2}
  .plane{position:relative!important;left:auto!important;right:auto!important;top:auto!important;transform:none!important;width:auto!important;max-width:none;box-shadow:none;font-size:11.5px}
  .formula{font-size:13px;white-space:normal}
  .desk{left:auto;right:8px;top:6px;bottom:auto;width:min(320px,calc(100% - 16px));max-height:48%}
  .desk.min{width:auto}
  .transport{flex-wrap:wrap;gap:6px;padding:6px 8px}
  .timeline{order:-1;flex:1 1 100%}
  .clock{min-width:0}
  #app{grid-template-rows:auto minmax(220px,40vh) minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
  .brand{display:none}
  .top .icon-btn{height:24px;padding:0 6px;font-size:11px}
  .transport .clock{display:none}
  .transport .icon-btn{height:26px}
  .guide .g-text.dim{font-size:13px}
  .insp-tabs button{padding:6px 2px;font-size:11.5px}
  .insp-body{padding:10px 12px 20px}
  .stage{grid-row:2;grid-column:1}
  .inspector{grid-row:3;grid-column:1;width:auto;border-left:0;border-top:1px solid var(--line)}
  .inspector[hidden]{display:none}
  .transport{grid-row:4}
  .guide .g-text{font-size:15px;line-height:1.55}
  .opchip{top:auto;bottom:40px}
}

function trackedParam(ctx, eta) {
  const r = ctx.store.training("sgd", eta);
  const ex = exOf(ctx);
  const g = lossAndGrad(r.history[0].head, r.train).grad.Wu;
  let best = { r: 0, c: ex.target, g: 0 };
  for (let k = 0; k < g.length; k++) if (Math.abs(g[k][ex.target]) > Math.abs(best.g)) best = { r: k, c: ex.target, g: g[k][ex.target] };
  return { ...best, before: r.history[0].head.Wu[best.r][best.c], after: r.history[1].head.Wu[best.r][best.c], target: ex.target };
}

function showHead(ctx, head, ex, { target = true, gradient = null } = {}) {

  ctx.state("bars-out", { logits: e.z, probs: e.p, target: target ? ex.target : undefined, chosen: argmax(e.p), showLogits: true, showProbs: true });
  ctx.state("mx-gWu", { values: gradient });
  ctx.show("mx-gWu", !!gradient);
  return e;
}

function reflectionState(ctx, e) {
  const { log } = ctx.store.reflection();
  const attempt = Math.min(3, Math.floor((Math.max(1, e) - 1) / 3) + 1);
  const phase = (Math.max(1, e) - 1) % 3;
  const entry = log[attempt - 1];
  const notes = Math.min(log.length - 1, attempt - 1 + (phase === 2 ? 1 : 0));
  return { log, attempt, phase, entry, notes };
}

function compareChart(rows, key = "finalTest", label = "prueba final") {
  const w = 400;
  const h = 150;
  const pad = { l: 34, r: 10, t: 10, b: 26 };
  const X = (i) => pad.l + ((i + 0.5) / rows.length) * (w - pad.l - pad.r);
  const Y = (v) => pad.t + (1 - v) * (h - pad.t - pad.b);
  const out = [`<svg class="chart" viewBox="0 0 ${w} ${h}">`];
  for (const v of [0, 0.25, 0.5, 0.75, 1]) out.push(`<line class="grid" x1="${pad.l}" x2="${w - pad.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pad.l - 4}" y="${Y(v) + 3}" text-anchor="end">${(v * 100).toFixed(0)}%</text>`);
  rows.forEach((r, i) => {
    const a = r.A[key];
    const b = r.B[key];
    const color = b > a + 1e-9 ? "var(--c-ok)" : b < a - 1e-9 ? "var(--c-bad)" : "var(--c-off)";
    out.push(`<line x1="${X(i)}" x2="${X(i)}" y1="${Y(a)}" y2="${Y(b)}" stroke="${color}" stroke-width="1.6"/>`);
    out.push(`<circle cx="${X(i)}" cy="${Y(a)}" r="3.2" fill="var(--c-off)"/><circle cx="${X(i)}" cy="${Y(b)}" r="3.2" fill="var(--c-g)"/>`);
    out.push(`<text x="${X(i)}" y="${h - 10}" text-anchor="middle">${r.seed}</text>`);
  });
  out.push(`<text x="${w - pad.r}" y="${h - 1}" text-anchor="end">semilla</text><text x="2" y="${pad.t - 2}">${label}</text></svg>`);
  return out.join("");
}

function metricsOf(rows) {
  const out = { limit: rows[0].A.ledger.limit };
  for (const m of ["A", "B"]) {
    const list = rows.map((r) => r[m]);
    const mean = (f) => list.reduce((t, r) => t + f(r), 0) / list.length;
    const valid = list.reduce((t, r) => t + r.valid, 0);
    const search = list.reduce((t, r) => t + r.ledger.search, 0);
    const qualities = list.map((r) => r.quality).filter((q) => q !== null && q !== undefined);
    out[m] = {
      test: mean((r) => r.finalTest),
      audit: mean((r) => r.finalAudit),
      valid,
      costPer: valid ? `${Math.round(search / valid)} ejecuciones` : "no aplicable",
      quality: qualities.length ? pct(qualities.reduce((t, q) => t + q, 0) / qualities.length) : "no aplicable",
      dev: Math.round(mean((r) => r.ledger.desarrollo)),
      val: Math.round(mean((r) => r.ledger.validación)),
      search: Math.round(mean((r) => r.ledger.search)),
      aud: Math.round(mean((r) => r.ledger.auditoría)),
      tst: Math.round(mean((r) => r.ledger.prueba)),
    };
  }
  return out;
}

function makeBus() {
  const subscribers = new Set();
  const log = [];
  return {
    log,
    on(fn) {
      subscribers.add(fn);
      return () => subscribers.delete(fn);
    },
    emit(event) {
      const record = { ...event, time: performance.now() };
      log.push(record);
      if (log.length > 600) log.shift();
      for (const fn of subscribers) fn(record);
      return record;
    },
  };
}

return { makeBus };

const ABOUT = `<button class="x" data-about="close" aria-label="Cerrar">×</button>
  <div class="kind">Qué es esto</div>
  <h2>Anatomía de la automejora recursiva</h2>
  <p>Un laboratorio dibujado como maqueta para entender <b>qué tendría que cambiar en un sistema de IA para que su próxima versión también pudiera producir mejores mejoras</b>. Los números se calculan en esta página: no es un video.</p>
  <ul>
    <li><b>Qué muestra.</b> Un Transformer pequeño (el modelo), el agente que lo rodea (contexto, herramientas, código, datos, evaluador y archivo de versiones) y, a la derecha, tres estaciones con algoritmos de mejora.</li>
    <li><b>Qué permite.</b> Seguir la lección en 10 capítulos con la Guía; detener cualquier operación, repetirla y ver sus números; tocar una pieza para saber qué hace; cambiar parámetros en la mesa de control y ver cómo cambia todo.</li>
    <li><b>Qué no es.</b> No es un sistema real ni un plano de hardware: las posiciones son conceptuales y algunas reglas se inventaron para la demostración; cada número dice de dónde sale.</li>
  </ul>
  <div class="row"><button class="btn primary" data-about="start">Empezar</button><span class="kv">Para volver a verlo, hacé clic en el piso del laboratorio.</span></div>`;
let aboutStep = 0;
function showAbout(open) {
  if (open) {
    ref.about.innerHTML = ABOUT;
    aboutStep = lesson.L.i;
  }
  ref.about.hidden = !open;
}
ref.about.addEventListener("click", (event) => {
  const button = event.target.closest("[data-about]");
  if (button) showAbout(false);
});
lesson.onChange(() => {
  if (!ref.about.hidden && (lesson.L.i !== aboutStep || lesson.L.auto || lesson.L.phase !== "orient")) showAbout(false);
});
ctx.unpick = unpick;
function pickCard(title, text, { more = false } = {}) {
  return `<span class="pick-card"><button class="x" data-pick="close" aria-label="Cerrar">×</button><b>${title}</b>${text ? `<em>${text}</em>` : ""}${more ? '<button class="link" data-pick="more">Detalles en el panel ›</button>' : ""}</span>`;
}
ref.labels.addEventListener("click", (event) => {
  const button = event.target.closest("[data-pick]");
  if (!button) return;
  if (button.getAttribute("data-pick") === "more") {
    if (ref.inspector.hasAttribute("hidden")) toggleInspector(true);
    selectTab("obj");
  }
  unpick({ restore: true });
});
ref.tip.addEventListener("click", (event) => {
  const button = event.target.closest("[data-pick]");
  if (!button) return;
  if (button.getAttribute("data-pick") === "more") {
    if (ref.inspector.hasAttribute("hidden")) toggleInspector(true);
    selectTab("obj");
  }
  unpick({ restore: true });
});
function click(event) {
  const { cell, id } = hit(event);
  const again = id && !cell && engine.labels.has("pick") && engine.objects.get(id)?.el.hasAttribute("data-sel");
  if (!id || id === "plate" || again) {
    unpick({ restore: true });
    if (ctx.tab === "obj") renderInspector(ctx, null);
    if (id === "plate") showAbout(true);
    return;
  }
  unpick();
  showAbout(false);
  const entry = engine.objects.get(id);
  const target = entry.info || id;
  engine.objects.get(id).el.setAttribute("data-sel", "");
  ctx.focus([id, `${id}-front`, ...(entry.parent ? [entry.parent] : [])]);
  if (cell && entry.cell) {
    const [i, j] = cell.getAttribute("data-cell").split(",").map(Number);
    const info = entry.cell(i, j);
    selection = { id: target, cell: info, obj: id, i, j };
    if (entry.onCell) entry.onCell(i, j, ctx);
    if (info) {
      const row = info.rows.find(([key]) => /\[i,j\]|salida|resultado/i.test(key)) || info.rows.find(([key]) => /operación/.test(key));
      const owner = nameOf(id);
      ref.tip.innerHTML = pickCard(`${owner ? `${esc(owner[0])} · ` : ""}${info.title}`, row ? `${row[0]}: ${row[1]}` : "", { more: true });
      const box = ref.stage.getBoundingClientRect();
      ref.tip.style.left = `${Math.max(8, Math.min(box.width - 300, event.clientX - box.left - 120))}px`;
      ref.tip.style.top = `${Math.max(8, event.clientY - box.top - 96)}px`;
      ref.tip.classList.add("on", "pinned");
    }
  } else {
    selection = target;
    const info = infoFor(ctx, target);
    const named = nameOf(id) || (info ? [info.title, firstSentence(info.what)] : [id, ""]);
    engine.label("pick", { obj: id, dz: 6, cls: "tag pick", html: pickCard(esc(named[0]), esc(named[1]), { more: !!info }) });
  }
  lesson.interrupt("inspección");
  if (ctx.tab === "obj") renderInspector(ctx, selection);
  wakeLoop();
}
function hover(event) {
  if (ref.tip.classList.contains("pinned")) return;
  const { cell, id } = hit(event);
  const entry = id && engine.objects.get(id);
  if (cell && entry && entry.cell) {
    const [i, j] = cell.getAttribute("data-cell").split(",").map(Number);
    const info = entry.cell(i, j);
    if (info) {
      ref.tip.innerHTML = `<div class="tt">${info.title}</div>${info.rows.map(([key, value]) => `<div><span class="k">${key}</span> ${value}</div>`).join("")}`;
      const box = ref.stage.getBoundingClientRect();
      const x = Math.min(box.width - 350, event.clientX - box.left + 14);
      ref.tip.style.left = `${Math.max(8, x)}px`;
      ref.tip.style.top = `${Math.max(8, event.clientY - box.top + 14)}px`;
      ref.tip.classList.add("on");
      return;
    }
  }
  ref.tip.classList.remove("on");
}
ref.svg.addEventListener("pointerleave", () => ref.tip.classList.contains("pinned") || ref.tip.classList.remove("on"));
ctx.inspectFromList = (id) => {
  selection = id;
  renderInspector(ctx, id);
};

ref.help.addEventListener("click", () => {
  if (ref.inspector.hasAttribute("hidden")) toggleInspector(true);
  selectTab("settings");
});
window.addEventListener("keydown", (event) => {
  if (event.target.closest && event.target.closest("input, select, textarea")) return;
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const key = event.key;
  const act = (fn) => {
    event.preventDefault();
    fn();
    wakeLoop();
  };
  if (key === "Enter") {
    if (event.target.closest && event.target.closest("button, a, [role=slider]")) return;
    act(() => lesson.next());
  } else if (key === " ") act(() => (lesson.L.auto ? lesson.pause() : lesson.play()));
  else if (key === "ArrowRight") act(() => lesson.next());
  else if (key === "ArrowLeft") act(() => lesson.prev());
  else if (key === "r" || key === "R") act(() => lesson.repeat());
  else if (key === "n" || key === "N") act(() => toggleInspector());
  else if (key === "v" || key === "V") act(() => setWindows(![...beatScoped.panels.values()].some((node) => !node.classList.contains("min"))));
  else if (key === "x" || key === "X") act(() => sound.setMuted(!sound.prefs.muted));
  else if (key === "]") act(() => lesson.goToChapter(Math.min(9, lesson.step.beat.c + 1)));
  else if (key === "[") act(() => lesson.goToChapter(Math.max(0, lesson.step.beat.c - (lesson.step.index > lesson.steps.findIndex((s) => s.beat.c === lesson.step.beat.c) ? 0 : 1))));
  else if (key === "q" || key === "Q") act(() => (manual(), engine.setCamera({ azimuth: engine.cam.azimuth - 10 })));
  else if (key === "e" || key === "E") act(() => (manual(), engine.setCamera({ azimuth: engine.cam.azimuth + 10 })));
  else if (key === "w" || key === "W") act(() => (manual(), engine.setCamera({ elevation: engine.cam.elevation + 4 })));
  else if (key === "s" || key === "S") act(() => (manual(), engine.setCamera({ elevation: engine.cam.elevation - 4 })));
  else if (key === "+" || key === "=") act(() => (manual(), engine.setCamera({ scale: engine.cam.scale * 1.2 })));
  else if (key === "-" || key === "_") act(() => (manual(), engine.setCamera({ scale: engine.cam.scale / 1.2 })));
  else if (key === "c" || key === "C") act(() => (director.guidedCamera(), lesson.applyLook()));
  else if (key === "i" || key === "I") act(() => toggleInspector());
  else if (key === "m" || key === "M") act(() => setMode(director.S.mode === "tour" ? "free" : "tour"));
  else if (key === "Escape") act(() => (engine.labels.has("pick") || ref.tip.classList.contains("pinned") || !ref.chapterList.hidden ? (unpick({ restore: true }), openChapters(false)) : goBack()));
  else if (key === "0") act(() => resetLesson());
  else if (key === "?" || key === "h" || key === "H") act(() => ref.help.click());
});

window.__sceneQA = {
  get state() {
    return { beat: director.beat.id, chapter: director.beat.c + 1, t: director.S.t, event: director.eventOf(director.beat, director.S.t), playing: lesson.L.auto, mode: director.S.mode, camera: { ...engine.cam }, changed: changedNow, user: JSON.parse(JSON.stringify(store.user)), step: lesson.step.id, stepIndex: lesson.L.i, phase: lesson.L.phase, narrator: lesson.L.narrator, tab: ctx.tab };
  },
  seek: (chapter, beat = 0, t = 0) => {
    director.seek(director.chapterStart(chapter - 1) + beat, t);
    director.flyTo(director.cameraFor(director.beat), 0);
    wakeLoop();
  },
  go(index, phase = "orient") {
    director.S.manualCam = false;
    lesson.enter(index, phase);
    director.flyTo(director.cameraFor(director.beat), 0);
    if (director.S.stepTo !== null) director.animateTo(director.S.stepTo, 0);
    wakeLoop();
  },
  steps: () => lesson.steps.map((s) => {
    const orient = lesson.textOf(s.orient);
    const act = lesson.textOf(s.act);
    const result = lesson.textOf(s.result);
    const refs = [...`${orient} ${act} ${result}`.matchAll(/\{\{([^|}]+)\|/g)].flatMap((m) => m[1].split(","));
    const terms = [...`${orient} ${act} ${result}`.matchAll(/\[\[([^|\]]+)\|/g)].map((m) => m[1]);
    return { id: s.id, beat: s.beat.id, from: s.from, to: s.to, missing: !!s.missing, words: { orient: wordsOf(orient), act: wordsOf(act), result: wordsOf(result) }, refs, terms, concept: s.concept || null, cues: (typeof s.cues === "function" ? s.cues(ctx) : s.cues || []).map((c) => c.op), look: Array.isArray(s.look) ? s.look : null };
  }),
  objectIds: () => [...engine.objects.keys()],
  concepts: () => Object.keys(CONCEPTS),
  missing: () => lesson.missing,
  total: () => lesson.total,
  beats: () => director.beats.map((b) => b.id),
  events: bus.log,
  sound,
  soundOps: SOUND_OPS.map((o) => o.op),
  renderOffline,
  lesson,
  store,
  engine,
  director,
  ctx,
};

lesson.enter(0);
director.flyTo(director.cameraFor(director.beat), 0);
showAbout(true);
wakeLoop();

return {  };
})();
</script>
</body>
